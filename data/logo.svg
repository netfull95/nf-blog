<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="netFull logo">
  <defs>
    <linearGradient id="nfCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <!--
    "nF" monogram — lowercase n (bold, rounded arch) + uppercase F (bold, sharp).
    Ligature effect: the two glyphs share the same baseline (y=80) and cap-height
