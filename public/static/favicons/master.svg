<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Master SVG for favicon set generation.
  Upload this file to https://realfavicongenerator.net/ → configure per-platform:
    - iOS: keep the dark rounded background (renders on Home Screen)
    - Android Chrome: keep dark background (theme_color = #0f172a)
    - Desktop browsers: RFG will crop to a square favicon.ico
    - Safari pinned tab: use ONLY the "nF" mask (monochrome), color = #06b6d4

  Then download the bundle → replace files in public/static/favicons/.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100" role="img" aria-label="netFull">
  <defs>
    <linearGradient id="nfCyanFav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square background — dark navy so cyan glyph pops in dark + light tabs -->
  <rect x="0" y="0" width="100" height="100" rx="20" ry="20" fill="#0f172a"/>
  <!-- nF glyphs — identical paths to data/logo.svg for brand consistency -->
  <path fill="url(#nfCyanFav)" d="M 10 80 L 10 32 A 12 12 0 0 1 22 20 L 34 20 A 12 12 0 0 1 46 32 L 46 80 L 34 80 L 34 32 A 6 6 0 0 0 22 32 L 22 80 Z"/>
  <path fill="url(#nfCyanFav)" d="M 54 20 L 90 20 L 90 32 L 66 32 L 66 42 L 84 42 L 84 52 L 66 52 L 66 80 L 54 80 Z"/>
</svg>
